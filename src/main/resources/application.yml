server:
  port: 8081
  tomcat:
    # Vidéos Mon RCC : ne jamais couper la connexion pendant l'envoi d'un gros fichier (sinon le
    # navigateur n'affiche que « Failed to fetch ») — le dépassement est refusé proprement (413).
    max-swallow-size: -1
    connection-timeout: 120s
spring:
  application:
    name: rcc-portal
  # Fichier local, jamais commité (.gitignore) — permet de renseigner les clés (Anthropic...)
  # sans dépendre d'une variable d'environnement système que IntelliJ doit hériter (source
  # récurrente de blocage : setx + redémarrage IntelliJ ne suffit pas toujours). Si le fichier
  # n'existe pas ("optional:"), rien ne change — les ${ANTHROPIC_API_KEY:} etc. restent actifs.
  config:
    import: "optional:file:./application-secrets.yml"
  datasource:
    url: jdbc:sqlserver://10.16.1.16:1433;databaseName=SAGED;encrypt=false;trustServerCertificate=true
    username: ${RCC_DB_USERNAME:eciappuser}
    password: ${RCC_DB_PASSWORD:C@ntg3tme1n$}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 15000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  thymeleaf:
    cache: false
  servlet:
    multipart:
      # Photos et vidéos Mon RCC (voir ImageStorageService) — réglable sans recompiler.
      max-file-size: ${RCC_UPLOAD_MAX_SIZE:500MB}
      max-request-size: ${RCC_UPLOAD_MAX_SIZE:500MB}
      file-size-threshold: 2MB
  mail:
    host: ${RCC_MAIL_HOST:localhost}
    port: ${RCC_MAIL_PORT:25}
    username: ${RCC_MAIL_USERNAME:}
    password: ${RCC_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${RCC_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${RCC_MAIL_STARTTLS:false}
    test-connection: false
logging:
  level:
    root: INFO
    com.ecobank.rccportal: INFO
quality:
  audio:
    storage-dir: "C:/rcc-portal-audio"
  ai:
    # Azure AI Speech — transcription (Fast Transcription API). Créer une ressource
    # "Speech" dans le portail Azure, région + clé disponibles dans "Keys and Endpoint".
    azure-speech-key: ${AZURE_SPEECH_KEY:}
    azure-speech-region: ${AZURE_SPEECH_REGION:francecentral}
    azure-speech-language: ${AZURE_SPEECH_LANGUAGE:fr-FR}
    # Azure OpenAI Service — analyse. Nécessite une ressource Azure OpenAI déployée
    # avec un modèle (ex. gpt-4o) ; le nom du déploiement est choisi à la création,
    # pas forcément identique au nom du modèle.
    azure-openai-endpoint: ${AZURE_OPENAI_ENDPOINT:}
    azure-openai-key: ${AZURE_OPENAI_KEY:}
    azure-openai-deployment: ${AZURE_OPENAI_DEPLOYMENT:gpt-4o}
    # Anthropic — conservé pour l'analyse de fichiers RAF (analyzeFile, réservé à l'IT).
    anthropic-key: ${ANTHROPIC_API_KEY:}
    anthropic-model: ${ANTHROPIC_MODEL:claude-sonnet-4-5}
# Copilot Studio — utilisé par RAF (assistant conversationnel), service IA autorisé par Ecobank.
# Secret Direct Line : Copilot Studio > Paramètres de l'agent > Canaux > Application web/mobile personnalisée.
copilot:
  enabled: ${COPILOT_ENABLED:false}
  directline:
    secret: ${COPILOT_DIRECTLINE_SECRET:}
    endpoint: ${COPILOT_DIRECTLINE_ENDPOINT:https://directline.botframework.com}
    timeout-seconds: ${COPILOT_DIRECTLINE_TIMEOUT_SECONDS:60}
# Microsoft Graph — intégration réelle Teams/Outlook (voir docs/GRAPH_SETUP.md pour la
# procédure complète d'inscription de l'application dans Azure AD / Entra ID).
graph:
  tenant-id: ${AZURE_TENANT_ID:}
  client-id: ${AZURE_CLIENT_ID:}
  client-secret: ${AZURE_CLIENT_SECRET:}
# Recherche web — complément de la barre de recherche globale et de RAF quand la Base de
# connaissances / les procédures internes ne suffisent pas. Plusieurs moteurs, essayés dans
# l'ordre de provider-order jusqu'au premier qui répond. Bing Web Search API a été RETIRÉE
# par Microsoft (août 2025) : utilisez SearXNG (auto-hébergé, recommandé), Brave, Tavily ou
# Google Programmable Search. Wikipédia (gratuit, sans clé) sert de filet de sécurité.
# Diagnostic (IT) : GET /api/ralph/search/diagnose
websearch:
  enabled: ${WEBSEARCH_ENABLED:true}
  # « ecobank » = DuckDuckGo limité à ecobank.com (pages officielles d'abord), « duckduckgo » =
  # web général — tous deux GRATUITS et SANS CLÉ. Les moteurs à clé restent prioritaires s'ils sont configurés.
  provider-order: ${WEBSEARCH_PROVIDER_ORDER:searxng,brave,tavily,google,ecobank,duckduckgo,wikipedia}
  free-web-enabled: ${WEBSEARCH_FREE_WEB_ENABLED:true}
  language: ${WEBSEARCH_LANGUAGE:fr}
  result-count: ${WEBSEARCH_RESULT_COUNT:5}
  timeout-seconds: ${WEBSEARCH_TIMEOUT_SECONDS:10}
  cache-minutes: ${WEBSEARCH_CACHE_MINUTES:15}
  searxng:
    url: ${WEBSEARCH_SEARXNG_URL:}
  brave:
    key: ${WEBSEARCH_BRAVE_KEY:}
  tavily:
    key: ${WEBSEARCH_TAVILY_KEY:}
  google:
    key: ${WEBSEARCH_GOOGLE_KEY:}
    cx: ${WEBSEARCH_GOOGLE_CX:}
  bing:
    endpoint: ${WEBSEARCH_BING_ENDPOINT:https://api.bing.microsoft.com/v7.0/search}
    key: ${WEBSEARCH_BING_KEY:}
    market: ${WEBSEARCH_BING_MARKET:fr-FR}
  wikipedia:
    enabled: ${WEBSEARCH_WIKIPEDIA_ENABLED:true}
rcc:
  uploads:
    photos-dir: ${RCC_PHOTOS_DIR:C:/rcc-portal-photos}
    kb-files-dir: ${RCC_KB_FILES_DIR:C:/rcc-portal-kb-files}
    # Vidéos Mon RCC : taille maximale en Mo (garder ≤ spring.servlet.multipart.max-file-size).
    max-video-mb: ${RCC_UPLOAD_MAX_VIDEO_MB:500}
  map:
    # Fond de carte de l'onglet « Agences / Carte » (Base de connaissance, bank-map.js).
    # Le réseau Ecobank peut bloquer tile.openstreetmap.org : pointer alors vers un serveur de
    # tuiles interne (même format {z}/{x}/{y}), ou laisser vide pour ne pas charger de fond —
    # les agences restent positionnées sur un fond neutre et listées sous la carte.
    tile-url: "${RCC_MAP_TILE_URL:https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png}"
  translation:
    # Traducteur (/translator + bouton « Traduire » de RAF) — aucune IA générative. Les sources
    # configurées sont essayées dans cet ordre jusqu'à la première qui répond correctement ;
    # une source sans clé/URL est simplement ignorée. Diagnostic : bouton « Diagnostiquer la
    # connexion » du Traducteur. Voir docs/TRANSLATION_OFFLINE_SETUP.md.
    provider-order: "${RCC_TRANSLATION_PROVIDER_ORDER:libretranslate,local,custom,deepl,azure,mymemory}"
    timeout-seconds: ${RCC_TRANSLATION_TIMEOUT_SECONDS:12}
    cache-size: 500
    # Service de traduction interne éventuellement hébergé par l'IT Ecobank.
    # Contrat : POST {"text","sourceLang","targetLang"} -> {"translatedText"}.
    custom-url: "${RCC_TRANSLATION_CUSTOM_URL:}"
    # Chemin principal : Application -> TranslationService -> LibreTranslate local -> Argos
    # Translate -> traduction. LibreTranslate tourne sur le même serveur que le portail
    # (scripts/start-libretranslate.ps1), aucune donnée ne sort du réseau Ecobank.
    # Si le serveur LibreTranslate est arrêté, le portail passe à la source suivante (Argos
    # en direct via scripts/translate.py, si configuré). Vider l'URL pour le désactiver.
    libretranslate:
      url: "${RCC_TRANSLATION_LIBRETRANSLATE_URL:http://localhost:5000}"
      api-key: "${RCC_TRANSLATION_LIBRETRANSLATE_API_KEY:}"
    # DeepL API — clé gratuite (se termine par ":fx") ou Pro ; l'URL est déduite de la clé.
    deepl:
      api-key: "${RCC_TRANSLATION_DEEPL_API_KEY:}"
      url: "${RCC_TRANSLATION_DEEPL_URL:}"
    # Azure AI Translator — ressource « Translator » du portail Azure (Keys and Endpoint).
    azure:
      key: "${RCC_TRANSLATION_AZURE_KEY:}"
      region: "${RCC_TRANSLATION_AZURE_REGION:}"
      endpoint: "${RCC_TRANSLATION_AZURE_ENDPOINT:https://api.cognitive.microsofttranslator.com}"
    # MyMemory — gratuit, sans clé, dernier recours. Renseigner un e-mail valide fait passer
    # le quota gratuit de 5 000 à 50 000 caractères/jour.
    mymemory:
      enabled: ${RCC_TRANSLATION_MYMEMORY_ENABLED:true}
      email: "${RCC_TRANSLATION_MYMEMORY_EMAIL:}"
    offline:
      # Traduction locale hors-ligne (Argos Translate via scripts/translate.py) — aucune
      # dépendance à internet au moment de traduire. Vide par défaut (source ignorée).
      # Prérequis : pip install argostranslate langdetect --break-system-packages
      python-executable: "${RCC_TRANSLATION_OFFLINE_PYTHON_EXECUTABLE:}"
      script-path: "${RCC_TRANSLATION_OFFLINE_SCRIPT_PATH:}"
      timeout-seconds: 30
  spellcheck:
    # Correcteur (onglet « Correcteur » du Traducteur). fr/en tournent en local (LanguageTool
    # embarqué). Pour les autres langues (es, pt, de, it, nl...), renseigner un serveur
    # LanguageTool auto-hébergé (docker run -p 8010:8010 erikvl87/languagetool), ex.
    # http://srv-languagetool:8010 — jamais le service public languagetool.org pour des
    # données clients.
    remote-url: "${RCC_SPELLCHECK_REMOTE_URL:}"
    # Règles désactivées : purement stylistiques/typographiques, elles noyaient les vraies
    # fautes (ex. « écrire 3 en lettres », espaces insécables, apostrophes typographiques).
    disabled-rules: "${RCC_SPELLCHECK_DISABLED_RULES:NOMBRES_EN_LETTRES,NOMBRES_EN_LETTRES_2,FRENCH_WHITESPACE,APOS_TYP,APOS_INCORRECT,TOO_LONG_SENTENCE,FR_SPLIT_WORDS_HYPHEN,EN_QUOTES,DASH_RULE,WHITESPACE_PARAGRAPH,PUNCTUATION_PARAGRAPH_END,EN_UNPAIRED_QUOTES,UNPAIRED_BRACKETS}"
    # Vocabulaire métier jamais signalé comme faute (complète la table WordTerms).
    ignore-words: "${RCC_SPELLCHECK_IGNORE_WORDS:Ecobank,Rapidtransfer,Xpress,XpressCash,CashXpress,Omni,Ecobankpay,EcobankPay,UEMOA,CEDEAO,BCEAO,RCC,RIB,IBAN,SWIFT,OTP,PIN,DAB,GAB,TPE,KYC,FCFA,XOF,XAF,MoMo,Orange,Wave,Visa,Mastercard,GIMAC,GIM,Clairaudio,RAF}"
  ocr:
    # OCR local (PaddleOCR via scripts/ocr.py) pour l'import KPI par capture d'écran — gratuit,
    # sans cloud, fonctionne même si le crédit Anthropic est épuisé. Vide par défaut : tant que
    # ces 2 valeurs ne sont pas renseignées, le système se rabat sur Claude vision (si configuré).
    # Prérequis à installer manuellement : Python + `pip install paddleocr paddlepaddle --break-system-packages`.
    python-executable: "${RCC_OCR_PYTHON_EXECUTABLE:}"
    script-path: "${RCC_OCR_SCRIPT_PATH:}"
    timeout-seconds: 60
  auth:
    jwt-secret: ${RCC_JWT_SECRET:ChangeThisSecretKeyForProduction123456789}
    jwt-access-expires-in-minutes: 60
    jwt-refresh-expires-in-days: 30
    bcrypt-rounds: 12
