<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RCC Portal Enterprise — Reporting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        .rpt-branch { border: 1px solid rgba(0,0,0,.08); border-radius: .5rem; margin-bottom: .75rem; overflow: hidden; }
        .rpt-branch-header, .rpt-service-header, .rpt-team-header {
            cursor: pointer; padding: .8rem 1rem; background: #f8f9fc;
            display: flex; align-items: center; justify-content: space-between; font-weight: 600; color: #1f2a44;
        }
        .rpt-service-header { background: #fff; padding-left: 1.75rem; font-size: .92rem; border-top: 1px solid #f0f1f4; }
        .rpt-team-header { background: #fbfbfd; padding-left: 2.5rem; font-size: .85rem; font-weight: 500; border-top: 1px solid #f5f5f7; }
        .rpt-branch-body, .rpt-service-body, .rpt-team-body { display: none; padding: .5rem 1rem 1rem; }
        .rpt-branch.open > .rpt-branch-body, .rpt-service.open > .rpt-service-body, .rpt-team.open > .rpt-team-body { display: block; }
        .rpt-chevron { transition: transform .15s ease; display: inline-block; }
        .open > .rpt-branch-header .rpt-chevron, .open > .rpt-service-header .rpt-chevron, .open > .rpt-team-header .rpt-chevron { transform: rotate(90deg); }
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="content">
        <div th:replace="~{fragments/header :: header}"></div>
        <main id="page-content">
            <div class="container-fluid">

                <div class="welcome-banner d-flex justify-content-between align-items-end flex-wrap gap-3">
                    <div>
                        <h2>Reporting</h2>
                        <p class="text-muted">Vue d'équipe agrégée pour le mois sélectionné</p>
                    </div>
                    <form id="monthForm" class="d-flex align-items-end gap-2">
                        <div>
                            <label class="form-label small mb-1" for="countryFilterInput">Filiale</label>
                            <select id="countryFilterInput" class="form-select form-select-sm" style="width:150px;">
                                <option value="CI" selected>Côte d'Ivoire</option>
                                <option value="">Toutes filiales</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label small mb-1" for="monthInput">Mois</label>
                            <input type="month" id="monthInput" class="form-control form-control-sm">
                        </div>
                        <button type="submit" class="btn btn-sm btn-primary">Appliquer</button>
                        <a id="exportBtn" class="btn btn-sm btn-outline-secondary" href="#">
                            <i class="bi bi-download"></i> Exporter (CSV)
                        </a>
                        <a id="exportExcelBtn" class="btn btn-sm btn-outline-success" href="#">
                            <i class="bi bi-file-earmark-excel"></i> Exporter (Excel)
                        </a>
                        <a id="exportWordBtn" class="btn btn-sm btn-outline-primary" href="#">
                            <i class="bi bi-file-earmark-word"></i> Exporter (Word)
                        </a>
                        <a id="exportPptBtn" class="btn btn-sm btn-outline-danger" href="#">
                            <i class="bi bi-file-earmark-ppt"></i> Exporter (PowerPoint)
                        </a>
                    </form>
                </div>

                <div id="loadError" class="alert alert-danger" style="display:none;"></div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <div id="reportingTree">
                            <p class="text-center text-muted">Chargement…</p>
                        </div>
                    </div>
                </div>

                <!-- Détail individuel -->
                <div class="modal fade" id="agentDetailModal" tabindex="-1">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="agentDetailName">—</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <table class="table table-sm">
                                    <tbody id="agentDetailBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Correction rapide équipe/service — depuis la ligne "Sans service"/"Sans équipe" -->
                <div class="modal fade" id="fixOrgModal" tabindex="-1">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Corriger <span id="fixOrgName">—</span></h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <input type="hidden" id="fixOrgUserId">
                                <label class="form-label small">Équipe (Activité)</label>
                                <input type="text" class="form-control mb-3" id="fixOrgActivity" placeholder="Ex. INBOUND VOICE">
                                <label class="form-label small">Service</label>
                                <select class="form-select" id="fixOrgService">
                                    <option value="">— Ne pas changer —</option>
                                </select>
                                <div id="fixOrgResult" class="small mt-2"></div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
                                <button type="button" class="btn btn-primary" id="fixOrgSaveBtn">Enregistrer</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/preferences.js}"></script>
<script th:src="@{/js/rcc-api.js}"></script>
<script th:src="@{/js/session.js}"></script>
<script th:src="@{/js/reports.js}"></script>
</body>
</html>
