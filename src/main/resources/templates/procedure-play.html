<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RCC Portal Enterprise — Parcours interactif</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        body { background: #eef2f7; }
        .pp-header {
            background: linear-gradient(135deg, var(--eco-blue), #003E8A); color: #fff;
            padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 10;
        }
        .pp-container { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 6rem; }
        .pp-progress-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; margin-top: .5rem; }
        .pp-progress-fill { height: 100%; background: #fff; transition: width .35s ease; }
        .pp-bubble-row { display: flex; margin-bottom: .9rem; }
        .pp-bubble { max-width: 78%; padding: .7rem 1rem; border-radius: 1rem; font-size: .92rem; line-height: 1.4; }
        .pp-bubble-bot { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); border-bottom-left-radius: .3rem; }
        .pp-bubble-user { background: var(--eco-blue); color: #fff; margin-left: auto; border-bottom-right-radius: .3rem; }
        .pp-bubble-row.user { justify-content: flex-end; }
        .pp-options { display: flex; flex-direction: column; gap: .5rem; margin-top: .75rem; }
        .pp-suggestion { background: #fff; border: 1px solid #e4eaf2; border-radius: .6rem; padding: .6rem .9rem; font-size: .85rem; margin-top: .5rem; }
        .pp-fab-instant {
            position: fixed; bottom: 24px; right: 24px; z-index: 1050;
        }
    </style>
</head>
<body>

<div class="pp-header">
    <div>
        <div class="fw-bold" id="ppProcedureTitle">Parcours interactif</div>
        <div class="small opacity-75" id="ppStepLabel">Étape 1</div>
        <div class="pp-progress-track" style="width:220px;"><div class="pp-progress-fill" id="ppProgressFill" style="width:8%;"></div></div>
    </div>
    <div class="d-flex gap-2">
        <button type="button" class="btn btn-sm btn-light" id="ppRestartBtn"><i class="bi bi-arrow-counterclockwise"></i></button>
        <a th:href="@{/procedures}" class="btn btn-sm btn-outline-light"><i class="bi bi-x-lg"></i> Fermer</a>
    </div>
</div>

<div class="pp-container" id="ppThread"></div>

<button type="button" class="btn btn-warning fw-semibold shadow pp-fab-instant" id="unInstantBtn">
    <i class="bi bi-pause-circle-fill"></i> UN INSTANT
</button>

<!-- Mise en attente du client — recherche rapide sur la thématique bloquante -->
<div class="modal fade" id="unInstantModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title"><i class="bi bi-pause-circle-fill"></i> Client mis en attente</h5>
            </div>
            <div class="modal-body text-center">
                <div class="display-6 mb-2" id="unInstantTimer">00:00</div>
                <p class="text-muted small mb-3">Où voulez-vous chercher l'information ?</p>
                <div class="d-grid gap-2">
                    <a th:href="@{/procedures}" class="btn btn-outline-primary">
                        <i class="bi bi-list-check"></i> Procédure
                    </a>
                    <a th:href="@{/knowledge}" class="btn btn-outline-primary">
                        <i class="bi bi-book-fill"></i> Base de connaissance
                    </a>
                    <button type="button" class="btn btn-outline-primary" id="unInstantRafBtn">
                        <i class="bi bi-rocket-takeoff-fill"></i> RAF
                    </button>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success w-100" id="unInstantResumeBtn">
                    <i class="bi bi-play-circle-fill"></i> Reprendre l'appel
                </button>
            </div>
        </div>
    </div>
</div>

<!-- RAF (Ralph) — même widget que sur le reste du site -->
<button type="button" id="ralphFab" class="ralph-fab" title="Demander à RAF">
    <i class="bi bi-rocket-takeoff-fill"></i>
</button>
<div id="ralphPanel" class="ralph-panel d-none">
    <div class="ralph-panel-header">
        <span><i class="bi bi-rocket-takeoff-fill"></i> RAF</span>
        <button type="button" id="ralphCloseBtn" class="btn-close btn-close-white"></button>
    </div>
    <div id="ralphThread" class="ralph-thread">
        <div class="ralph-msg ralph-msg-bot">Bonjour ! Posez-moi une question sur une procédure ou un article.</div>
    </div>
    <form id="ralphFabForm" class="ralph-panel-input">
        <input type="file" id="ralphFileInput" class="d-none" accept=".xlsx,.xls,.pdf,.docx,.csv,.txt">
        <button type="button" class="btn btn-outline-secondary" id="ralphFileBtn" title="Importer un fichier à analyser">
            <i class="bi bi-paperclip"></i>
        </button>
        <input type="text" id="ralphFabInput" class="form-control" placeholder="Votre question…" autocomplete="off">
        <button type="button" class="btn btn-outline-secondary" id="ralphMicBtn" title="Parler à RAF">
            <i class="bi bi-mic-fill"></i>
        </button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-send-fill"></i></button>
    </form>
</div>
<style>
    .ralph-fab {
        position: fixed; bottom: 24px; left: 24px; width: 58px; height: 58px; border-radius: 50%;
        background: linear-gradient(135deg, var(--eco-blue), #0F9D6C); color: #fff; border: none;
        font-size: 1.5rem; box-shadow: 0 6px 18px rgba(0,0,0,.25); z-index: 1050;
        display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .ralph-panel {
        position: fixed; bottom: 24px; left: 24px; width: 360px; max-width: 92vw; height: 480px;
        max-height: 78vh; background: #fff; border-radius: 1rem; box-shadow: 0 10px 40px rgba(0,0,0,.22);
        z-index: 1060; display: flex; flex-direction: column; overflow: hidden;
    }
    .ralph-panel-header {
        background: linear-gradient(135deg, var(--eco-blue), #0F9D6C); color: #fff; padding: .85rem 1rem;
        display: flex; justify-content: space-between; align-items: center; font-weight: 700;
    }
    .ralph-thread { flex-grow: 1; overflow-y: auto; padding: 1rem; background: #f4f6fb; }
    .ralph-msg { max-width: 85%; padding: .55rem .8rem; border-radius: .9rem; margin-bottom: .6rem; font-size: .88rem; white-space: pre-wrap; }
    .ralph-msg-bot { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); border-bottom-left-radius: .25rem; }
    .ralph-msg-user { background: var(--eco-blue); color: #fff; margin-left: auto; border-bottom-right-radius: .25rem; }
    .ralph-result-card { background: #fff; border: 1px solid #e4e8f0; border-radius: .6rem; padding: .5rem .7rem; margin-top: .4rem; font-size: .82rem; }
    .ralph-panel-input { display: flex; gap: .5rem; padding: .65rem; border-top: 1px solid #eee; }
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/rcc-api.js}"></script>
<script th:src="@{/js/session.js}"></script>
<script th:src="@{/js/ralph-widget.js}"></script>
<script th:src="@{/js/procedure-play.js}"></script>
</body>
</html>
