<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>RCC Portal Enterprise — Accueil</title>

    <link th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"
          rel="stylesheet">

    <link th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/dashboard.css}">

</head>

<body>

<div class="layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="content">

        <div th:replace="~{fragments/header :: header}"></div>

        <main id="page-content">

            <div class="container-fluid">

                <!-- Bannière d'accueil — image/texte modifiables par Admin ou QA (communication) -->
                <p class="text-muted mb-2" id="personalGreeting"></p>
                <div class="card dashboard-card shadow-sm mb-4 position-relative text-white" id="heroBanner"
                     style="min-height:280px;border:none;overflow:hidden;background:linear-gradient(120deg,#0057B8,#003E8A);background-size:cover;background-position:center;">
                    <div class="position-absolute top-0 start-0 w-100 h-100" style="background:rgba(0,20,50,.45);"></div>
                    <div class="card-body position-relative d-flex flex-column justify-content-center" style="min-height:280px;">
                        <h1 class="fw-bold mb-2" id="heroHeadline">Bienvenue sur RCC Portal Enterprise</h1>
                        <p class="mb-3 opacity-90" id="heroSubheadline" style="max-width:600px;">
                            Retrouvez vos procédures, formations et outils au même endroit.
                        </p>
                        <a href="#" id="heroCtaBtn" class="btn btn-light fw-semibold" style="width:fit-content;display:none;">En savoir plus</a>
                    </div>
                    <button class="btn btn-sm btn-light position-absolute top-0 end-0 m-2" id="editHeroBtn" style="display:none;">
                        <i class="bi bi-pencil"></i> Modifier
                    </button>
                    <label class="btn btn-sm btn-light position-absolute top-0 m-2" id="heroImageLabel" style="right:110px;display:none;cursor:pointer;">
                        <i class="bi bi-camera"></i> Photo
                        <input type="file" accept="image/*" class="d-none" id="heroImageInput">
                    </label>
                </div>

                <!-- Formulaire d'édition de la bannière (Admin/QA) -->
                <div class="card dashboard-card shadow-sm mb-4" id="heroEditCard" style="display:none;">
                    <div class="card-body">
                        <h6 class="card-title mb-3">Modifier la bannière d'accueil</h6>
                        <div class="row g-2">
                            <div class="col-12">
                                <label class="form-label small">Titre</label>
                                <input type="text" class="form-control" id="heroHeadlineInput">
                            </div>
                            <div class="col-12">
                                <label class="form-label small">Sous-titre</label>
                                <textarea class="form-control" id="heroSubheadlineInput" rows="2"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small">Texte du bouton (optionnel)</label>
                                <input type="text" class="form-control" id="heroCtaLabelInput" placeholder="Ex: Voir les procédures">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small">Lien du bouton</label>
                                <input type="text" class="form-control" id="heroCtaUrlInput" placeholder="/procedures">
                            </div>
                            <div class="col-12">
                                <button class="btn btn-primary btn-sm" id="saveHeroBtn">Enregistrer</button>
                                <button class="btn btn-outline-secondary btn-sm" id="cancelHeroBtn">Annuler</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- KPI (QA/Admin uniquement) -->
                <div class="row g-4 mb-4 qa-only" id="dashboardCards" style="display:none;"></div>

                <!-- Grille d'outils (tout le monde, filtrée par profil) -->
                <h5 class="mb-3" data-i18n="dashboard.tools">Vos outils</h5>
                <div class="row g-4" id="toolsGrid"></div>

                <button type="button" class="btn btn-outline-primary mt-4 d-none" id="externalToolsBtn" data-bs-toggle="modal" data-bs-target="#externalToolsModal">
                    <i class="bi bi-grid-3x3-gap-fill"></i> <span data-i18n="dashboard.externalTools">Outils &amp; Portails</span>
                </button>

                <div class="modal fade" id="externalToolsModal" tabindex="-1">
                    <div class="modal-dialog modal-xl modal-dialog-scrollable">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" data-i18n="dashboard.externalTools">Outils &amp; Portails</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="row g-4" id="externalToolsGrid"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Actualités Ecobank — visible tous portails, éditable admin uniquement -->
                <div class="d-flex justify-content-between align-items-center mb-3 mt-5">
                    <h5 class="mb-0"><i class="bi bi-newspaper"></i> Actualités Ecobank</h5>
                    <button type="button" class="btn btn-sm btn-outline-primary d-none" id="addNewsBtn">
                        <i class="bi bi-plus-lg"></i> Publier une actualité
                    </button>
                </div>

                <div class="card dashboard-card shadow-sm mb-4 d-none" id="newsFormCard">
                    <div class="card-body">
                        <h6 class="card-title mb-3" id="newsFormTitle">Nouvelle actualité</h6>
                        <div class="row g-2">
                            <div class="col-12">
                                <label class="form-label small">Titre</label>
                                <input type="text" class="form-control" id="newsTitleInput">
                            </div>
                            <div class="col-12">
                                <label class="form-label small">Photo d'illustration</label>
                                <input type="file" class="form-control" id="newsImageInput" accept="image/*">
                                <img id="newsImagePreview" src="" alt="" style="display:none;max-height:140px;border-radius:.5rem;" class="mt-2">
                            </div>
                            <div class="col-12">
                                <label class="form-label small">Contenu</label>
                                <div id="newsContentEditor"></div>
                            </div>
                            <div class="col-12">
                                <button class="btn btn-primary btn-sm" id="saveNewsBtn">Publier</button>
                                <button class="btn btn-outline-secondary btn-sm" id="cancelNewsBtn">Annuler</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-4 mb-4" id="newsGrid"></div>

                <div class="modal fade" id="newsReadModal" tabindex="-1">
                    <div class="modal-dialog modal-lg modal-dialog-scrollable">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="newsReadTitle"></h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <img id="newsReadImage" src="" alt="" class="w-100 mb-3" style="border-radius:.5rem;max-height:320px;object-fit:cover;">
                                <div id="newsReadContent"></div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </main>

    </div>

</div>

<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/preferences.js}"></script>
<script th:src="@{/js/rcc-api.js}"></script>
<script th:src="@{/js/session.js}"></script>
<script th:src="@{/js/external-tools.js}"></script>
<script th:src="@{/js/richtext-editor.js}"></script>
<script th:src="@{/js/dashboard.js}"></script>

</body>
</html>
