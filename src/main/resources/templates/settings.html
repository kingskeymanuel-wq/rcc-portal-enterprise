<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RCC Portal Enterprise — Paramètres</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="content">
        <div th:replace="~{fragments/header :: header}"></div>
        <main id="page-content">
            <div class="container-fluid">

                <div class="welcome-banner">
                    <div>
                        <h2 data-i18n="settings.title">Paramètres</h2>
                        <p class="text-muted" data-i18n="settings.subtitle">Votre profil et vos préférences</p>
                    </div>
                </div>

                <div id="profileSaved" class="alert alert-success" style="display:none;">Profil mis à jour.</div>
                <div id="profileError" class="alert alert-danger" style="display:none;"></div>

                <div class="row g-4">
                    <div class="col-lg-7">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title mb-3" data-i18n="settings.myProfile"><i class="bi bi-person-circle"></i> Mon profil</h5>

                                <div class="d-flex align-items-center gap-3 mb-3">
                                    <img id="photoPreview" src="/images/avatar.png" alt="Photo" title="Cliquer pour agrandir"
                                         class="rounded-circle" style="width:72px;height:72px;object-fit:cover;cursor:pointer;">
                                    <div class="flex-grow-1">
                                        <label class="form-label small mb-1">Photo de profil</label>
                                        <input id="photoFileInput" type="file" accept=".jpg,.jpeg,.png,.webp,.gif" class="form-control form-control-sm">
                                        <div class="form-text" id="photoUploadStatus"></div>
                                    </div>
                                </div>

                                <form id="profileForm">
                                    <p class="mb-2"><strong id="profileName">—</strong>
                                        <span class="text-muted small" id="profileUsername"></span></p>

                                    <div class="mb-2">
                                        <label class="form-label small" data-i18n="settings.phone">Téléphone</label>
                                        <input id="phoneInput" type="tel" class="form-control" maxlength="30">
                                    </div>
                                    <div class="mb-2">
                                        <label class="form-label small" data-i18n="settings.birthdate">Date de naissance</label>
                                        <input id="birthdateInput" type="date" class="form-control">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small" data-i18n="settings.bio">Bio</label>
                                        <textarea id="bioInput" class="form-control" rows="3" maxlength="1000"></textarea>
                                    </div>

                                    <p class="text-muted small">
                                        <i class="bi bi-info-circle"></i>
                                        Le mot de passe se gère depuis votre compte Active Directory Ecobank, pas ici.
                                    </p>

                                    <button type="submit" class="btn btn-primary" data-i18n="settings.save">
                                        <i class="bi bi-check-lg"></i> Enregistrer
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-5">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title mb-3" data-i18n="settings.appearance"><i class="bi bi-sliders"></i> Apparence</h5>

                                <div class="mb-4">
                                    <label class="form-label small" data-i18n="settings.language">Langue</label>
                                    <div class="btn-group w-100" role="group">
                                        <input type="radio" class="btn-check" name="langChoice" id="langFr" value="fr">
                                        <label class="btn btn-outline-primary" for="langFr">Français</label>
                                        <input type="radio" class="btn-check" name="langChoice" id="langEn" value="en">
                                        <label class="btn btn-outline-primary" for="langEn">English</label>
                                    </div>
                                </div>

                                <div>
                                    <label class="form-label small" data-i18n="settings.theme">Thème</label>
                                    <div class="btn-group w-100" role="group">
                                        <input type="radio" class="btn-check" name="themeChoice" id="themeLight" value="light">
                                        <label class="btn btn-outline-secondary" for="themeLight">
                                            <i class="bi bi-sun-fill"></i> <span data-i18n="settings.themeLight">Clair</span>
                                        </label>
                                        <input type="radio" class="btn-check" name="themeChoice" id="themeDark" value="dark">
                                        <label class="btn btn-outline-secondary" for="themeDark">
                                            <i class="bi bi-moon-stars-fill"></i> <span data-i18n="settings.themeDark">Sombre</span>
                                        </label>
                                    </div>
                                </div>

                                <div class="mt-4">
                                    <label class="form-label small">Police d'écriture</label>
                                    <select class="form-select" id="fontChoice">
                                        <option value="system">Standard (système)</option>
                                        <option value="classic">Classique (Arial)</option>
                                        <option value="serif">Élégante (Georgia)</option>
                                        <option value="rounded">Arrondie (Trebuchet)</option>
                                        <option value="mono">Machine à écrire (monospace)</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/preferences.js}"></script>
<script th:src="@{/js/rcc-api.js}"></script>
<script th:src="@{/js/session.js}"></script>
<script th:src="@{/js/settings.js}"></script>
<div class="modal fade" id="photoLightbox" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark">
            <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-2" data-bs-dismiss="modal"></button>
            <img id="photoLightboxImg" src="" alt="Photo" style="width:100%;max-height:80vh;object-fit:contain;">
        </div>
    </div>
</div>

</body>
</html>
