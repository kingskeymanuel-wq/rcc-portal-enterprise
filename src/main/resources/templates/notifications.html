<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RCC Portal Enterprise — Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="content">
        <div th:replace="~{fragments/header :: header}"></div>
        <main id="page-content">
            <div class="container-fluid">

                <div class="welcome-banner">
                    <div>
                        <h2 data-i18n="notifications.title">Notifications</h2>
                        <p class="text-muted" data-i18n="notifications.subtitle">Toutes vos notifications</p>
                    </div>
                </div>

                <div class="card dashboard-card shadow-sm">
                    <div class="card-body">
                        <div id="notificationsList" class="list-group list-group-flush">
                            <p class="text-muted text-center">Chargement…</p>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/preferences.js}"></script>
<script th:src="@{/js/rcc-api.js}"></script>
<script th:src="@{/js/session.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
</body>
</html>
