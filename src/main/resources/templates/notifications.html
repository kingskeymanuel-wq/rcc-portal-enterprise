<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RCC Portal Enterprise — Notifications</title>
    <link th:href="@{/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="content">
        <div th:replace="~{fragments/header :: header}"></div>
        <main id="page-content">
            <div class="container-fluid">

                <div class="welcome-banner">
                    <div>
                        <h2 data-i18n="notifications.title">Notifications</h2>
                        <p class="text-muted" data-i18n="notifications.subtitle">Toutes vos notifications</p>
                    </div>
                </div>

                <div class="card dashboard-card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between mb-3">
                            <div class="btn-group btn-group-sm" role="group" aria-label="Filtre">
                                <button type="button" class="btn btn-outline-secondary active" data-notif-filter="all">Toutes</button>
                                <button type="button" class="btn btn-outline-secondary" data-notif-filter="unread">Non lues <span id="notifUnreadCount" class="badge bg-primary ms-1">0</span></button>
                            </div>
                            <button type="button" id="notifReadAllBtn" class="btn btn-sm btn-primary"><i class="bi bi-check2-all me-1"></i>Tout marquer comme lu</button>
                        </div>
                        <p class="small text-muted mb-2"><i class="bi bi-funnel me-1"></i>Vous ne recevez que les notifications qui vous concernent : votre profil, votre filiale et vos services.</p>
                        <div id="notificationsList" class="list-group list-group-flush">
                            <p class="text-muted text-center">Chargement…</p>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/preferences.js}"></script>
<script th:src="@{/js/rcc-api.js}"></script>
<script th:src="@{/js/session.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
</body>
</html>
