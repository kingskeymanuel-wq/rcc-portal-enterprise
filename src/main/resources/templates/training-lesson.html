<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RCC Portal Enterprise — Leçon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        .lesson-progress-bar-wrap { position: sticky; top: 0; z-index: 50; background: #fff; padding: .5rem 0 .75rem; border-bottom: 1px solid #e9ecef; }
        .lesson-progress-track { height: 10px; border-radius: 6px; background: #eef1f5; overflow: hidden; }
        .lesson-progress-fill { height: 100%; background: linear-gradient(90deg,#0057B8,#00A651); transition: width .25s ease; }
        .lesson-content-scroll { max-height: 55vh; overflow-y: auto; border: 1px solid #e9ecef; border-radius: 10px; padding: 1.25rem 1.5rem; background: #fafbfc; }
        .lesson-locked-badge { font-size: .75rem; }
        .lesson-complete-banner { display:none; }
        .lesson-complete-banner.show { display:flex; }
        #lessonVideo { width: 100%; border-radius: 10px; background:#000; }
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="content">
        <div th:replace="~{fragments/header :: header}"></div>
        <main id="page-content">
            <div class="container-fluid" style="max-width:900px;">

                <div class="lesson-progress-bar-wrap">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div>
                            <a th:href="@{/training}" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left"></i> Retour à la formation</a>
                            <h4 class="mb-0 mt-1" id="lessonTitle">Chargement…</h4>
                        </div>
                        <div class="text-end">
                            <span class="badge bg-primary" id="lessonPercentBadge">0%</span>
                            <div class="text-muted small mt-1" id="lessonMaxRateBadge"></div>
                        </div>
                    </div>
                    <div class="lesson-progress-track">
                        <div class="lesson-progress-fill" id="lessonProgressFill" style="width:0%"></div>
                    </div>
                </div>

                <div class="alert alert-success d-flex align-items-center gap-2 mt-3 lesson-complete-banner" id="lessonCompleteBanner">
                    <i class="bi bi-check-circle-fill fs-4"></i>
                    <div><strong>Leçon complétée !</strong> Votre parcours de A à Z a été enregistré.</div>
                </div>

                <div class="card dashboard-card shadow-sm my-4" id="lessonVideoCard" style="display:none;">
                    <div class="card-body">
                        <video id="lessonVideo" controls controlsList="noplaybackrate" preload="metadata">
                            Votre navigateur ne supporte pas la lecture vidéo.
                        </video>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <small class="text-muted"><i class="bi bi-shield-lock"></i> Vitesse de lecture plafonnée pour garantir un suivi réel du contenu.</small>
                            <small class="text-muted">Vidéo visionnée : <span id="videoWatchedLabel">0%</span></small>
                        </div>
                    </div>
                </div>

                <div class="card dashboard-card shadow-sm">
                    <div class="card-body">
                        <div class="lesson-content-scroll" id="lessonScrollArea">
                            <div id="lessonContentHtml">Chargement du contenu…</div>
                            <div style="height:1px;" id="lessonScrollEnd"></div>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4 mb-5">
                    <button class="btn btn-outline-secondary" id="btnPrevLesson" disabled><i class="bi bi-chevron-left"></i> Leçon précédente</button>
                    <button class="btn btn-primary" id="btnNextLesson" disabled>Leçon suivante <i class="bi bi-chevron-right"></i></button>
                </div>

            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/rcc-api.js}"></script>
<script th:src="@{/js/session.js}"></script>
<script>
    // L'id de la leçon vient du chemin /training/lesson/{id}
    window.__LESSON_ID__ = parseInt(window.location.pathname.split('/').filter(Boolean).pop(), 10);
</script>
<script th:src="@{/js/training-lesson.js}"></script>
</body>
</html>
