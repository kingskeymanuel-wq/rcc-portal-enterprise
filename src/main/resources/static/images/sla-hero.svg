<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" preserveAspectRatio="xMaxYMid slice">
  <!-- Illustration animée « SLA & délais » : horloge qui tourne, chronomètre, flux de demandes. -->
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0057B8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#00A651" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0057B8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#0057B8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#00A651" stop-opacity="0"/>
    </linearGradient>
    <style>
      .spin { transform-origin: 300px 90px; animation: spin 12s linear infinite; }
      .spin-fast { transform-origin: 300px 90px; animation: spin 2s linear infinite; }
      .orbit { transform-origin: 300px 90px; animation: spin 18s linear infinite reverse; }
      .float1 { animation: float 6s ease-in-out infinite; }
      .float2 { animation: float 7s ease-in-out infinite 1.5s; }
      .float3 { animation: float 5s ease-in-out infinite .8s; }
      .flow { stroke-dasharray: 6 10; animation: flow 1.6s linear infinite; }
      .pulse { transform-origin: 300px 90px; animation: pulse 3s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes flow { to { stroke-dashoffset: -32; } }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: .1; transform: scale(1.12); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <!-- flux de demandes entrantes -->
  <path class="flow" d="M10 60 C 90 60, 150 90, 230 90" fill="none" stroke="url(#g2)" stroke-width="3" stroke-linecap="round"/>
  <path class="flow" d="M10 130 C 100 130, 160 100, 230 95" fill="none" stroke="url(#g2)" stroke-width="3" stroke-linecap="round" style="animation-delay:-.6s"/>

  <!-- halo + orbite -->
  <circle class="pulse" cx="300" cy="90" r="78" fill="url(#g1)"/>
  <g class="orbit">
    <circle cx="300" cy="18" r="5" fill="#00A651" opacity=".55"/>
    <circle cx="372" cy="90" r="4" fill="#0057B8" opacity=".45"/>
    <circle cx="238" cy="130" r="3.5" fill="#f4a300" opacity=".55"/>
  </g>

  <!-- horloge -->
  <circle cx="300" cy="90" r="52" fill="#fff" fill-opacity=".85" stroke="#0057B8" stroke-opacity=".35" stroke-width="3"/>
  <g stroke="#0057B8" stroke-opacity=".45" stroke-width="3" stroke-linecap="round">
    <line x1="300" y1="44" x2="300" y2="52"/><line x1="346" y1="90" x2="338" y2="90"/>
    <line x1="300" y1="136" x2="300" y2="128"/><line x1="254" y1="90" x2="262" y2="90"/>
  </g>
  <line class="spin" x1="300" y1="90" x2="300" y2="58" stroke="#0057B8" stroke-width="4" stroke-linecap="round"/>
  <line class="spin-fast" x1="300" y1="90" x2="324" y2="90" stroke="#00A651" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="300" cy="90" r="5" fill="#0057B8"/>

  <!-- pastilles flottantes (délais) -->
  <g class="float1"><rect x="150" y="18" width="54" height="22" rx="11" fill="#e6f7ec"/><text x="177" y="33" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#0a8a3e" text-anchor="middle">Instant</text></g>
  <g class="float2"><rect x="170" y="138" width="40" height="22" rx="11" fill="#eaf2ff"/><text x="190" y="153" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#0057B8" text-anchor="middle">24H</text></g>
  <g class="float3"><rect x="372" y="138" width="40" height="22" rx="11" fill="#fff3e0"/><text x="392" y="153" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#b06a00" text-anchor="middle">48H</text></g>
</svg>
